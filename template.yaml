AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  API for generating QR codes

Globals:
  Function:
    PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/qrcode-generator-permissions-boundary-ap-northeast-1"

Resources:
  Function:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: "."
      Handler: qrcode
      Runtime: provided.al2023
      Architectures: [arm64]
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref QrApi

  QrApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: API for generating QR codes
      Domain:
        CertificateArn: !Ref Certificate
        DomainName: "qr.shogo82148.com"
        Route53:
          HostedZoneName: "shogo82148.com."
          IpV6: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: "qr.shogo82148.com"
      ValidationMethod: "DNS"
      DomainValidationOptions:
        - DomainName: "qr.shogo82148.com"
          HostedZoneId: Z1TR8BQNS8S1I7
