AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  API for generating QR codes

Globals:
  Function:
    PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/qrcode-generator-permissions-boundary-ap-northeast-1"

Resources:
  Function:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: "."
      Handler: qrcode
      Runtime: provided.al2023
      Architectures: [arm64]
      # Send logs to an explicitly managed log group so the retention period
      # is controlled by this template instead of Lambda's default (never
      # expire).
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref QrApi

  # Operational log group for the function. RetentionInDays enforces the
  # 90-day retention promised in the privacy policy, so the commitment is
  # backed by infrastructure rather than a manual console setting.
  # The name matches the permissions boundary pattern
  # (/aws/lambda/qrcode-generator-Function-*) so the function role can write.
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-Function-logs"
      RetentionInDays: 90

  QrApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: API for generating QR codes
      Domain:
        CertificateArn: !Ref Certificate
        DomainName: "qr.shogo82148.com"
        Route53:
          HostedZoneName: "shogo82148.com."
          IpV6: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: "qr.shogo82148.com"
      ValidationMethod: "DNS"
      DomainValidationOptions:
        - DomainName: "qr.shogo82148.com"
          HostedZoneId: Z1TR8BQNS8S1I7
