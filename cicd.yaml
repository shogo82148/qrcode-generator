AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Continuous Deployment settings for QR code generator

Resources:
  # Permission Boundary for Roles
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permission Boundary for QR code generator Roles
      ManagedPolicyName: !Sub "qrcode-generator-permissions-boundary-${AWS::Region}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: FunctionLogs
            Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/qrcode-generator-Function-*:*"

  # CloudFormation Service Role for deploying SAM templates
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "qrcode-generator-cfn-service-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: deploy-sam-templates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateOrChangeOnlyWithBoundary
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:PutRolePermissionsBoundary"
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/qrcode-generator-FunctionRole-*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Ref PermissionsBoundary
              - Sid: NoBoundaryPolicyEdit
                Effect: Deny
                Action:
                  - "iam:CreatePolicyVersion"
                  - "iam:DeletePolicy"
                  - "iam:DeletePolicyVersion"
                  - "iam:SetDefaultPolicyVersion"
                Resource:
                  - !Ref PermissionsBoundary
              - Sid: NoBoundaryRoleDelete
                Effect: Deny
                Action:
                  - "iam:DeleteRolePermissionsBoundary"
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/qrcode-generator-FunctionRole-*"
              - Sid: OtherIAMTasks
                Effect: Allow
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/qrcode-generator-FunctionRole-*"
                Action:
                  # handle IAM Roles
                  - "iam:ListRolePolicies"
                  - "iam:ListRoleTags"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:UpdateRole"
                  - "iam:UpdateRoleDescription"
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                  - "iam:DeleteRole"
                  - "iam:PutRolePolicy"
                  - "iam:AttachRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:DeleteRolePolicy"

              - Sid: PassFunctionRole
                Effect: Allow
                Action: "iam:PassRole"
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/qrcode-generator-FunctionRole-*"
                Condition:
                  StringEquals:
                    "iam:PassedToService": lambda.amazonaws.com
              - Sid: CreateApiGatewayServiceLinkedRole
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway"
                Condition:
                  StringEquals:
                    "iam:AWSServiceName": ops.apigateway.amazonaws.com
              # SAM expansion authorizes against the AWS-owned transform ARN.
              - Sid: ApplyServerlessTransform
                Effect: Allow
                Action: "cloudformation:CreateChangeSet"
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: LambdaOperation
                Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:qrcode-generator-Function-*"
              # Manage the function's log group so RetentionInDays in template.yaml
              # can be applied by CloudFormation.
              - Sid: FunctionLogGroupOperation
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:DeleteLogGroup"
                  - "logs:PutRetentionPolicy"
                  - "logs:ListTagsForResource"
                  - "logs:TagResource"
                  - "logs:UntagResource"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/qrcode-generator-Function-logs"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/qrcode-generator-Function-logs:*"
              # DescribeLogGroups is used by the log-group resource handler to read
              # current state; it is scoped to the log-group resource type.
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: "logs:DescribeLogGroups"
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Sid: Route53Records
                Effect: Allow
                Action:
                  - "route53:GetHostedZone"
                  - "route53:ListResourceRecordSets"
                  - "route53:ChangeResourceRecordSets"
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/Z1TR8BQNS8S1I7"
              - Sid: Route53ChangeStatus
                Effect: Allow
                Action: "route53:GetChange"
                Resource: !Sub "arn:${AWS::Partition}:route53:::change/*"
              # RequestCertificate does not support resource-level permissions.
              # https://docs.aws.amazon.com/service-authorization/latest/reference/list_acm.html
              - Sid: RequestDomainCertificate
                Effect: Allow
                Action: "acm:RequestCertificate"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": !Ref AWS::Region
                    "acm:ValidationMethod": DNS
                  "ForAllValues:StringEquals":
                    "acm:DomainNames": ["qr.shogo82148.com"]
                  "Null":
                    "acm:DomainNames": "false"
              - Sid: CertificateOperation
                Effect: Allow
                Action:
                  - "acm:DescribeCertificate"
                  - "acm:DeleteCertificate"
                  - "acm:AddTagsToCertificate"
                  - "acm:RemoveTagsFromCertificate"
                  - "acm:ListTagsForCertificate"
                Resource: !Sub "arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*"
              - Sid: HttpApiOperation
                Effect: Allow
                Action:
                  - "apigateway:GET"
                  - "apigateway:POST"
                  - "apigateway:PUT"
                  - "apigateway:PATCH"
                  - "apigateway:DELETE"
                Resource:
                  # API IDs are assigned by API Gateway on creation.
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/qr.shogo82148.com"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/qr.shogo82148.com/*"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*"
              - Sid: ReadDeploymentArtifact
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/qrcode-generator/*"

  # for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "qrcode-generator-github-actions-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                "token.actions.githubusercontent.com:environment": "production"
                "token.actions.githubusercontent.com:sub": "repo:shogo82148@1157344/qrcode-generator@720052443:environment:production"
      Policies:
        - PolicyName: SAMDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PassRoleToCloudFormation
                Effect: Allow
                Action: "iam:PassRole"
                Resource: !GetAtt DeploymentRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": cloudformation.amazonaws.com
              - Sid: CloudFormationStackOperation
                Effect: Allow
                Action: "cloudformation:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/qrcode-generator/*"
              - Sid: ReadSAMArtifactBucket
                Effect: Allow
                Action: "cloudformation:DescribeStacks"
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - Sid: CloudFormationDenyImport
                Effect: Deny
                Action: "cloudformation:*"
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/qrcode-generator/*"
                Condition:
                  "ForAnyValue:StringLike":
                    "cloudformation:ImportResourceTypes": ["*"]
              - Sid: S3Operation
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:AbortMultipartUpload"
                  - "s3:ListMultipartUploadParts"
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/qrcode-generator/*"
              - Sid: S3ListOperation
                Effect: Allow
                Action: "s3:ListBucket"
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*"
