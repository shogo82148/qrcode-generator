<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="テキストやURLからQRコードをすぐに生成できるプレイグラウンド">
  <title>QR Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #13231d;
      --muted: #65716c;
      --paper: #f6f3ea;
      --card: rgba(255, 255, 255, .72);
      --line: rgba(19, 35, 29, .14);
      --green: #0c7c59;
      --green-dark: #07563f;
      --lime: #dafa57;
      --danger: #b42318;
      --shadow: 0 24px 70px rgba(27, 51, 42, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(218, 250, 87, .5), transparent 26rem),
        radial-gradient(circle at 95% 88%, rgba(12, 124, 89, .14), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 54px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 7px); gap: 3px; padding: 8px; border-radius: 9px; background: var(--ink); }
    .brand-mark i { width: 7px; height: 7px; background: white; border-radius: 1px; }
    .brand-mark i:last-child { background: var(--lime); }
    .nav { display: flex; gap: 8px; }
    .nav a { padding: 8px 14px; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid transparent; }
    .nav a:hover { color: var(--ink); }
    .nav a[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--card); }
    .intro { margin-bottom: 30px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--green-dark); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 24px; height: 2px; background: var(--green); }
    h1 { max-width: 690px; margin: 0; font-size: clamp(36px, 5vw, 62px); line-height: 1.02; letter-spacing: -.06em; }
    .lede { max-width: 610px; margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.7; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(360px, .86fr); overflow: hidden; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .controls { padding: 34px; border-right: 1px solid var(--line); }
    .preview { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 550px; padding: 38px; background: rgba(255, 255, 255, .4); }
    label, legend { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 760; }
    textarea, input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 13px; outline: none; color: var(--ink); background: rgba(255, 255, 255, .82); transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(12, 124, 89, .1); }
    textarea { min-height: 124px; resize: vertical; padding: 14px 15px; line-height: 1.55; }
    input, select { height: 46px; padding: 0 13px; }
    .count { float: right; color: var(--muted); font-weight: 500; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 21px; }
    fieldset { margin: 22px 0 0; padding: 0; border: 0; }
    .segments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .segments input { position: absolute; opacity: 0; pointer-events: none; }
    .segments label { margin: 0; padding: 11px; cursor: pointer; text-align: center; border: 1px solid var(--line); border-radius: 11px; background: rgba(255, 255, 255, .7); }
    .segments input:checked + label { color: white; border-color: var(--ink); background: var(--ink); }
    .segments input:focus-visible + label { box-shadow: 0 0 0 4px rgba(12, 124, 89, .15); }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .qr-frame { display: grid; place-items: center; width: min(100%, 330px); aspect-ratio: 1; padding: 22px; border: 1px solid var(--line); border-radius: 24px; background: white; box-shadow: 0 16px 40px rgba(19, 35, 29, .09); }
    .qr-frame img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .status { min-height: 22px; margin: 18px 0 12px; color: var(--muted); font-size: 13px; text-align: center; }
    .status.error { color: var(--danger); }
    .actions { display: flex; gap: 10px; width: min(100%, 330px); }
    button, .download { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border-radius: 13px; cursor: pointer; font-weight: 750; text-decoration: none; transition: transform .18s, background .18s; }
    button:active, .download:active { transform: translateY(1px); }
    .copy { flex: 1; color: var(--ink); border: 1px solid var(--line); background: white; }
    .copy:hover { background: #f8faf9; }
    .download { flex: 1.25; color: white; border: 1px solid var(--green); background: var(--green); }
    .download:hover { background: var(--green-dark); }
    footer { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 20px; }
      header { margin-bottom: 38px; }
      .workspace { grid-template-columns: 1fr; }
      .controls { border-right: 0; border-bottom: 1px solid var(--line); }
      .preview { min-height: auto; }
    }
    @media (max-width: 480px) {
      .shell { width: min(100% - 16px, 440px); }
      .controls, .preview { padding: 24px 18px; }
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .actions { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>QR Studio</div>
      <nav class="nav">
        <a href="/qr/playground" aria-current="page">QR</a>
        <a href="/microqr/playground">Micro QR</a>
        <a href="/rmqr/playground">rMQR</a>
      </nav>
    </header>

    <section class="intro">
      <p class="eyebrow">QR Code Playground</p>
      <h1>入力したら、すぐQR。</h1>
      <p class="lede">URLやテキストを入力して、仕上がりをリアルタイムに確認。用途に合わせてサイズや形式も細かく調整できます。</p>
    </section>

    <section class="workspace" aria-label="QRコード作成ツール">
      <form class="controls" id="controls">
        <div>
          <label for="data">内容 <span class="count"><span id="count">0</span> 文字</span></label>
          <textarea id="data" name="data" spellcheck="false">https://qr.shogo82148.com</textarea>
        </div>

        <div class="grid">
          <div>
            <label for="size">画像サイズ</label>
            <input id="size" name="size" type="number" min="29" max="4096" step="1" value="512" inputmode="numeric">
          </div>
          <div>
            <label for="format">ファイル形式</label>
            <select id="format" name="format">
              <option value="png">PNG</option>
              <option value="svg">SVG</option>
            </select>
          </div>
          <div>
            <label for="version">QRバージョン</label>
            <select id="version" name="version">
              <option value="">自動</option>
            </select>
          </div>
          <div>
            <label for="preset">サンプル</label>
            <select id="preset">
              <option value="">選択してください</option>
              <option value="https://example.com">Webサイト</option>
              <option value="mailto:hello@example.com">メール</option>
              <option value="tel:+81312345678">電話番号</option>
              <option value="WIFI:T:WPA;S:My Wi-Fi;P:password;;">Wi-Fi</option>
            </select>
          </div>
        </div>

        <fieldset>
          <legend>誤り訂正レベル</legend>
          <div class="segments">
            <input type="radio" name="level" id="level-l" value="L"><label for="level-l">L</label>
            <input type="radio" name="level" id="level-m" value="M" checked><label for="level-m">M</label>
            <input type="radio" name="level" id="level-q" value="Q"><label for="level-q">Q</label>
            <input type="radio" name="level" id="level-h" value="H"><label for="level-h">H</label>
          </div>
          <p class="hint">レベルが高いほど、汚れや欠けがあっても読み取りやすくなります。</p>
        </fieldset>
      </form>

      <div class="preview" aria-live="polite">
        <div class="qr-frame"><img id="qr" alt="生成されたQRコード"></div>
        <p class="status" id="status">QRコードを生成しています…</p>
        <div class="actions">
          <button class="copy" id="copy" type="button">API URLをコピー</button>
          <a class="download" id="download" download>ダウンロード</a>
        </div>
      </div>
    </section>
    <footer>入力内容は、QRコードを生成するためこのサーバーへ送信されます。</footer>
  </main>

  <script>
    const form = document.querySelector('#controls');
    const data = document.querySelector('#data');
    const size = document.querySelector('#size');
    const format = document.querySelector('#format');
    const version = document.querySelector('#version');
    const preset = document.querySelector('#preset');
    const qr = document.querySelector('#qr');
    const count = document.querySelector('#count');
    const status = document.querySelector('#status');
    const copy = document.querySelector('#copy');
    const download = document.querySelector('#download');
    let currentURL = '';
    let timer;

    for (let i = 1; i <= 40; i++) version.add(new Option(String(i), String(i)));

    function getURL() {
      const params = new URLSearchParams({ data: data.value, format: format.value });
      if (size.value) params.set('size', size.value);
      params.set('level', form.elements.level.value);
      if (version.value) params.set('version', version.value);
      return `/qr?${params}`;
    }

    function render() {
      count.textContent = [...data.value].length;
      currentURL = getURL();
      status.className = 'status';
      status.textContent = 'QRコードを生成しています…';
      qr.alt = data.value ? `「${data.value.slice(0, 60)}」のQRコード` : '空のQRコード';
      qr.src = currentURL;
      download.href = currentURL;
      download.download = `qrcode.${format.value}`;
    }

    function scheduleRender() {
      clearTimeout(timer);
      timer = setTimeout(render, 500);
    }

    form.addEventListener('input', scheduleRender);
    form.addEventListener('change', render);
    preset.addEventListener('change', () => {
      if (preset.value) data.value = preset.value;
      render();
    });
    qr.addEventListener('load', () => {
      status.className = 'status';
      status.textContent = `${size.value || '自動'} px · ${format.value.toUpperCase()} · レベル ${form.elements.level.value}`;
    });
    qr.addEventListener('error', () => {
      status.className = 'status error';
      status.textContent = '生成できませんでした。サイズや内容を確認してください。';
    });
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(new URL(currentURL, location.href).href);
        copy.textContent = 'コピーしました ✓';
        setTimeout(() => copy.textContent = 'API URLをコピー', 1600);
      } catch {
        copy.textContent = 'コピーできませんでした';
      }
    });

    render();
  </script>
</body>
</html>
