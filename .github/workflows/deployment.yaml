name: Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qr.shogo82148.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::445285296882:role/qrcode-generator-github-actions-ap-northeast-1
          aws-region: ap-northeast-1
      - name: Build
        run: sam build
      - name: Deploy using the existing artifact bucket
        shell: bash
        run: |
          artifact_bucket=$(aws cloudformation describe-stacks \
            --region ap-northeast-1 \
            --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue | [0]" \
            --output text)
          if [[ -z "$artifact_bucket" || "$artifact_bucket" == "None" ]]; then
            echo "::error::SAM artifact bucket is missing. Provision aws-sam-cli-managed-default before deploying."
            exit 1
          fi
          sam deploy --no-resolve-s3 --s3-bucket "$artifact_bucket"
